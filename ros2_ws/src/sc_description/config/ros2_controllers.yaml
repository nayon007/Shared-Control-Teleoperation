# Controllers loaded by gazebo_ros2_control.
#   joint_state_broadcaster  /joint_states
#   gripper_controller       holds the finger opening
#   arm_hold_controller      joint-space PID hold through the effort interfaces;
#                            used during start-up and by the Phase 3 baseline
#   cartesian_impedance_controller   step 4 (sc_control); takes over from the
#                            hold after the weld when launched with
#                            controller:=impedance
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz, same as the real FR3

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

    arm_hold_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    cartesian_impedance_controller:
      type: sc_control/CartesianImpedanceController

gripper_controller:
  ros__parameters:
    joints:
      - fr3_finger_joint1
    interface_name: position

arm_hold_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    # PID per joint, torque = p*e + i*int(e) + d*de [Nm/rad]; i_clamp bounds
    # the integral term [Nm]. It must exceed the gravity torque of a stretched
    # arm (joint 2 needs ~30 Nm with the hand at the handle; limit 87 Nm).
    gains:
      fr3_joint1: {p: 600.0, i: 300.0, d: 30.0, i_clamp: 60.0}
      fr3_joint2: {p: 600.0, i: 300.0, d: 30.0, i_clamp: 60.0}
      fr3_joint3: {p: 600.0, i: 300.0, d: 30.0, i_clamp: 60.0}
      fr3_joint4: {p: 600.0, i: 300.0, d: 30.0, i_clamp: 60.0}
      fr3_joint5: {p: 250.0, i: 100.0, d: 10.0, i_clamp: 12.0}
      fr3_joint6: {p: 150.0, i: 100.0, d: 10.0, i_clamp: 12.0}
      fr3_joint7: {p: 50.0,  i: 50.0,  d: 5.0,  i_clamp: 12.0}

# Step 4. tau = J^T (K e - D xdot) + N (k_n (q_n - q) - d_n qdot) [+ tau_g]
# Targets on /cartesian_impedance_controller/target_pose (frame fr3_link0).
cartesian_impedance_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    base_link: fr3_link0
    tip_link: fr3_hand_tcp
    # x y z [N/m], rotation about x y z [Nm/rad], base frame
    stiffness: [600.0, 600.0, 600.0, 30.0, 30.0, 30.0]
    damping:   [50.0, 50.0, 50.0, 2.0, 2.0, 2.0]
    nullspace_stiffness: 2.0
    nullspace_damping: 1.0
    pinv_damping: 0.05
    max_trans_error: 0.10     # [m]   bounds the spring force to K * 0.10 = 60 N
    max_rot_error: 0.3        # [rad]
    max_torque_rate: 1.0      # [Nm per 1 ms cycle], as on the real FR3
    torque_limit: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]
    gravity_compensation: false   # true when the simulator applies gravity to the arm
