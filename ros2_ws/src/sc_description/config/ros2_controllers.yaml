# Controllers loaded by gazebo_ros2_control.
#   joint_state_broadcaster  /joint_states
#   gripper_controller       holds the finger opening
#   arm_hold_controller      TEMPORARY joint-space PID hold through the effort
#                            interfaces (steps 2-3 only); replaced by the
#                            Cartesian impedance controller in step 4
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz, same as the real FR3

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

    arm_hold_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gripper_controller:
  ros__parameters:
    joints:
      - fr3_finger_joint1
    interface_name: position

arm_hold_controller:
  ros__parameters:
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    gains:  # PID per joint, torque = p*e + i*int(e) + d*de  [Nm/rad]
      fr3_joint1: {p: 600.0, i: 50.0, d: 30.0, i_clamp: 20.0}
      fr3_joint2: {p: 600.0, i: 50.0, d: 30.0, i_clamp: 20.0}
      fr3_joint3: {p: 600.0, i: 50.0, d: 30.0, i_clamp: 20.0}
      fr3_joint4: {p: 600.0, i: 50.0, d: 30.0, i_clamp: 20.0}
      fr3_joint5: {p: 250.0, i: 10.0, d: 10.0, i_clamp: 5.0}
      fr3_joint6: {p: 150.0, i: 10.0, d: 10.0, i_clamp: 5.0}
      fr3_joint7: {p: 50.0,  i: 5.0,  d: 5.0,  i_clamp: 2.0}
